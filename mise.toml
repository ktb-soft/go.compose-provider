[tools]
go = "1.27"
golangci-lint = "2.13.2"
lefthook = "2.1.12"

[hooks]
postinstall = "mise run postinstall"

[tasks.postinstall]
description = "Run postinstall tasks"
depends = ["init:lefthook"]

[tasks."init:lefthook"]
description = "Install lefthook"
run = "lefthook install"


# Go
# ——————————————————————————————————————————

[tasks.fmt]
description = "Format all Go source"
run = "gofmt -w ."

[tasks.vet]
description = "Run go vet"
run = "go vet ./..."

[tasks.lint]
description = "Run golangci-lint"
run = "golangci-lint run"

[tasks.test]
description = "Run the test suite"
run = "go test ./..."

[tasks.check]
description = "Run every guardrail"
depends = ["vet", "lint", "test"]
